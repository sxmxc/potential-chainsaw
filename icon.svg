<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Marble Engineer icon: rolling marble on golden track crossing teal engineering gear">
  <defs>
    <linearGradient id="gearBody" x1=".12" y1="0" x2=".85" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#158D9A"/>
      <stop offset=".48" stop-color="#086779"/>
      <stop offset="1" stop-color="#064455"/>
    </linearGradient>
    <linearGradient id="trackBed" x1="0" y1="0" x2=".18" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#FFE785"/>
      <stop offset=".48" stop-color="#FFD25B"/>
      <stop offset="1" stop-color="#F0A83C"/>
    </linearGradient>
    <radialGradient id="marble" cx=".29" cy=".24" r=".85">
      <stop offset="0" stop-color="#DBFFF2"/>
      <stop offset=".23" stop-color="#8AF5D8"/>
      <stop offset=".58" stop-color="#47D9BE"/>
      <stop offset="1" stop-color="#159D9B"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#081E2D" flood-opacity=".27"/>
    </filter>
    <path id="track" d="M 114,160 C 177,144 238,153 268,207 C 295,255 303,304 396,344"/>
  </defs>

  <!-- Gear is an identifiable structural backdrop, with the rim and hub deliberately visible. -->
  <g transform="rotate(-11 256 270)" filter="url(#shadow)">
    <path d="M 229.4,98.8 L 280.6,98.8 L 286.1,129.6 L 309.6,135.8 L 329.8,111.9 L 374.2,137.5 L 363.2,166.8 L 380.4,184.0 L 409.7,173.0 L 435.3,217.4 L 411.4,237.6 L 417.6,261.1 L 448.4,266.6 L 448.4,317.8 L 417.6,323.3 L 411.4,346.8 L 435.3,367.0 L 409.7,411.4 L 380.4,400.4 L 363.2,417.6 L 374.2,446.9 L 329.8,472.5 L 309.6,448.6 L 286.1,454.8 L 280.6,485.6 L 229.4,485.6 L 223.9,454.8 L 200.4,448.6 L 180.2,472.5 L 135.8,446.9 L 146.8,417.6 L 129.6,400.4 L 100.3,411.4 L 74.7,367.0 L 98.6,346.8 L 92.4,323.3 L 61.6,317.8 L 61.6,266.6 L 92.4,261.1 L 98.6,237.6 L 74.7,217.4 L 100.3,173.0 L 129.6,184.0 L 146.8,166.8 L 135.8,137.5 L 180.2,111.9 L 200.4,135.8 L 223.9,129.6 Z" fill="#073C50" stroke="#062D40" stroke-width="7" stroke-linejoin="round" transform="translate(0 -36)"/>
    <path d="M 229.4,98.8 L 280.6,98.8 L 286.1,129.6 L 309.6,135.8 L 329.8,111.9 L 374.2,137.5 L 363.2,166.8 L 380.4,184.0 L 409.7,173.0 L 435.3,217.4 L 411.4,237.6 L 417.6,261.1 L 448.4,266.6 L 448.4,317.8 L 417.6,323.3 L 411.4,346.8 L 435.3,367.0 L 409.7,411.4 L 380.4,400.4 L 363.2,417.6 L 374.2,446.9 L 329.8,472.5 L 309.6,448.6 L 286.1,454.8 L 280.6,485.6 L 229.4,485.6 L 223.9,454.8 L 200.4,448.6 L 180.2,472.5 L 135.8,446.9 L 146.8,417.6 L 129.6,400.4 L 100.3,411.4 L 74.7,367.0 L 98.6,346.8 L 92.4,323.3 L 61.6,317.8 L 61.6,266.6 L 92.4,261.1 L 98.6,237.6 L 74.7,217.4 L 100.3,173.0 L 129.6,184.0 L 146.8,166.8 L 135.8,137.5 L 180.2,111.9 L 200.4,135.8 L 223.9,129.6 Z" fill="url(#gearBody)" stroke="#063C4F" stroke-width="6" stroke-linejoin="round" transform="translate(0 -46)"/>
    <circle cx="255" cy="246" r="83" fill="#063E52" stroke="#39B2B2" stroke-width="15"/>
    <circle cx="255" cy="246" r="60" fill="#0E3042"/>
    <path d="M 193 211 A 76 76 0 0 1 317 211" fill="none" stroke="#6EDDD0" stroke-opacity=".5" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Raised, visibly curved marble channel, not a flat ribbon. -->
  <g filter="url(#shadow)" fill="none" stroke-linejoin="round" stroke-linecap="butt">
    <use href="#track" transform="translate(0 17)" stroke="#322251" stroke-width="109"/>
    <use href="#track" transform="translate(0 6)" stroke="#55318A" stroke-width="110"/>
    <use href="#track" stroke="#9B63D0" stroke-width="109"/>
    <use href="#track" stroke="#502B88" stroke-width="91"/>
    <use href="#track" stroke="#EDAD3D" stroke-width="79"/>
    <use href="#track" stroke="url(#trackBed)" stroke-width="69"/>
    <use href="#track" transform="translate(0 -1)" stroke="#FFF1A4" stroke-opacity=".65" stroke-width="2.5"/>
  </g>

  <!-- Front ledge over the marble: communicates a U-channel rather than a yellow stripe. -->
  <path d="M 113 195 C 186 179 207 184 236 229 C 271 286 288 343 380 382" fill="none" stroke="#402267" stroke-width="14" stroke-linecap="butt" opacity=".90"/>
  <path d="M 113 186 C 186 170 211 178 245 226 C 280 278 292 329 386 371" fill="none" stroke="#BC8BF0" stroke-width="9" stroke-linecap="butt"/>

  <!-- Marble visibly seated in top section of the track. -->
  <circle cx="175" cy="145" r="49" fill="#092F43" opacity=".55" transform="translate(6 9)"/>
  <circle cx="175" cy="145" r="48" fill="#0C3851" stroke="#063144" stroke-width="5"/>
  <circle cx="173" cy="140" r="41" fill="url(#marble)"/>
  <ellipse cx="156" cy="123" rx="15" ry="9" fill="#E8FFF6" opacity=".95" transform="rotate(-38 156 123)"/>
  <circle cx="192" cy="158" r="5.5" fill="#105969" opacity=".21"/>
</svg>
